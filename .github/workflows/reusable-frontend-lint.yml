name: Reusable Frontend Lint

on:
  workflow_call:
    inputs:
      web_dir:
        required: false
        type: string
        default: web
      node_version:
        required: false
        type: string
        default: '20'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Each app resolves `@mochi/web` via `file:../../../lib/web`, the local-dev
    # layout. Mounting the caller at apps/<repo-name>/ and lib/web at lib/web/
    # makes the same relative path resolve, and the caller dir is the working
    # directory so checks see a vanilla `git clone <app>`.
    defaults:
      run:
        working-directory: apps/${{ github.event.repository.name }}

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          path: apps/${{ github.event.repository.name }}
          fetch-depth: 0

      - name: Checkout @mochi/web (lib/web sibling for file dependency)
        uses: actions/checkout@v4
        with:
          repository: mochi-os/web
          path: lib/web

      # Apps declare `"@mochi/web": "workspace:*"`, which needs a workspace
      # root; locally that is the umbrella. CI synthesises one plus a shim
      # package.json at $GITHUB_WORKSPACE, mirroring mochi/package.json's
      # eslint-plugin-lingui and onlyBuiltDependencies - keep it in sync as the
      # root grows.
      - name: Synthesise workspace root for @mochi/web
        working-directory: ${{ github.workspace }}
        run: |
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - 'lib/*'
            - 'apps/*/web'
          onlyBuiltDependencies:
            - '@swc/core'
            - '@tailwindcss/oxide'
            - esbuild
          YAML
          cat > package.json <<'JSON'
          {
            "name": "mochi-ci-shim",
            "private": true,
            "devDependencies": {
              "eslint-plugin-lingui": "^0.13.1"
            }
          }
          JSON

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      # App repositories carry no lockfile and the canonical
      # mochi/pnpm-lock.yaml lives in the umbrella, which CI cannot see, so
      # --frozen-lockfile has nothing to freeze against. Every run resolves
      # fresh from the semver ranges in package.json.
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: pnpm install --no-frozen-lockfile

      - name: Lint frontend
        working-directory: apps/${{ github.event.repository.name }}/${{ inputs.web_dir }}
        run: pnpm lint --max-warnings=0

      - name: Unit tests
        working-directory: apps/${{ github.event.repository.name }}/${{ inputs.web_dir }}
        run: |
          # Run the vitest suite for apps that define a "test" script; apps
          # without one skip cleanly, so this is a no-op until an app adds tests.
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "no test script — skipping unit tests"
          fi

      - name: Check i18n catalogs
        working-directory: apps/${{ github.event.repository.name }}/${{ inputs.web_dir }}
        run: pnpm i18n:check

      - name: Check server label completeness (.conf)
        working-directory: apps/${{ github.event.repository.name }}
        run: |
          # Every key in labels/en.conf must be translated in each non-overlay
          # <lang>.conf; a value identical to English is allowed only when every
          # alphabetic word is a keep-word. KEEP mirrors
          # claude/scripts/i18n_glossary.py - keep the two in sync.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          OVERLAY = {"en","en-us","en-ca","fr-ca","es-ar","zh-hk","yue","nn","de-ch"}
          KEEP = {"mochi","stripe","github","pushbullet","ntfy","oauth","oidc",
                  "pkce","jwt","saml","libp2p","crm","comptroller","git","google",
                  "paypal","api","url","id","rss","qr","sgf","pgn","sha","apps",
                  "chat","chess","disputes","email","feeds","forums","go","help",
                  "home","market","mentions","menu","messages","moderation",
                  "notifications","rose","teal","violet","wiki","wikis","server"}
          WORD = re.compile(r"[A-Za-z]+")
          PH = re.compile(r"\{[^}]*\}")
          def keep(s):
              w = WORD.findall(PH.sub("", s))
              return bool(w) and all(x.lower() in KEEP for x in w)
          def parse(p):
              d = {}
              for ln in p.read_text(encoding="utf-8").splitlines():
                  ln = ln.strip()
                  if ln and not ln.startswith("#") and "=" in ln:
                      k, _, v = ln.partition("=")
                      d[k.strip()] = v.strip()
              return d
          labels = Path("labels")
          if not (labels / "en.conf").exists():
              print("No labels/en.conf; nothing to check.")
              sys.exit(0)
          en = parse(labels / "en.conf")
          violations = 0
          for conf in sorted(labels.glob("*.conf")):
              if conf.stem in OVERLAY:
                  continue
              translated = parse(conf)
              for key, en_value in en.items():
                  value = translated.get(key, "")
                  if not value or (value == en_value and not keep(en_value)):
                      print(f"::error file={conf}::{conf.stem}: untranslated label {key}")
                      violations += 1
          if violations:
              print(f"\n{violations} untranslated server labels", file=sys.stderr)
              sys.exit(1)
          print("Server labels complete in every locale.")
          PY

      - name: Check i18n glossary (brand/protocol terms)
        run: |
          # Brand/protocol terms (Mochi, Stripe, GitHub, OAuth, JWT, libp2p,
          # ...) must appear verbatim Latin script in every translation. Drop
          # `# i18n-glossary-ok: <term>` on a line to allowlist intentional
          # transliterations.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          GLOSSARY = ['Mochi','Stripe','GitHub','Pushbullet','ntfy','OAuth','OIDC','PKCE','JWT','SAML','libp2p']
          ALLOW_RE = re.compile(r'#\s*i18n-glossary-ok\b')
          ENTRY_RE = re.compile(r'(?:#[^\n]*\n)*msgid\s+(?P<id>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)\nmsgstr\s+(?P<str>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)', re.M)
          def parse(s):
              return ''.join(re.findall(r'"((?:[^"\\]|\\.)*)"', s)).replace('\\n','\n').replace('\\"','"').replace('\\\\','\\')
          violations = 0
          for po in list(Path('.').rglob('messages.po')) + list(Path('.').rglob('labels/*.conf')):
              if any(p in po.parts for p in ('node_modules','dist','.git')):
                  continue
              text = po.read_text(encoding='utf-8', errors='replace')
              if po.suffix == '.po':
                  for m in ENTRY_RE.finditer(text):
                      src, tgt = parse(m.group('id')), parse(m.group('str'))
                      if not src or not tgt:
                          continue
                      for term in GLOSSARY:
                          if term in src and term not in tgt:
                              line = text.count('\n', 0, m.start()) + 1
                              if not ALLOW_RE.search(text.split('\n')[line-1] if line-1 < len(text.split('\n')) else ''):
                                  print(f"::error file={po},line={line}::{term} missing from translation: {tgt[:80]}")
                                  violations += 1
              else:
                  for n, line in enumerate(text.splitlines(), 1):
                      if '=' not in line or ALLOW_RE.search(line):
                          continue
                      val = line.split('=', 1)[1].strip()
                      for term in GLOSSARY:
                          if term in val:
                              # Compare against en.conf to know if term should be there
                              en_path = po.parent / 'en.conf'
                              if en_path.exists() and term in en_path.read_text(encoding='utf-8'):
                                  continue  # term in source too — fine
                              if term not in val:
                                  print(f"::error file={po},line={n}::{term} should be verbatim: {val[:80]}")
                                  violations += 1
          if violations:
              print(f"\n{violations} glossary violations", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Check i18n format usage
        run: |
          # `.toFixed()`, `.toLocaleString*()`, `new Intl.*Format`, `moment()`
          # bypass useFormat() and render in browser locale, not user locale.
          # Allowlist with `// i18n-format-ok: <reason>` trailing comment.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          PATTERNS = [
              (re.compile(r'\.toFixed\(\s*\d+\s*\)'), 'toFixed'),
              (re.compile(r'\.toLocaleString\b'), 'toLocaleString'),
              (re.compile(r'\.toLocaleDateString\b'), 'toLocaleDateString'),
              (re.compile(r'\.toLocaleTimeString\b'), 'toLocaleTimeString'),
              (re.compile(r'new Intl\.(DateTimeFormat|NumberFormat)\b'), 'new Intl.*Format'),
              (re.compile(r'\bmoment\('), 'moment()'),
          ]
          ALLOW = re.compile(r'//\s*i18n-format-ok\b')
          INFRA = {'src/hooks/use-format.ts','src/lib/locale-format.ts','src/context/locale-provider.tsx','src/context/i18n-provider.tsx'}
          SKIP = {'node_modules','dist','.next','build','.git'}
          violations = 0
          for f in Path('.').rglob('*.ts'):
              if any(p in f.parts for p in SKIP):
                  continue
              if any(str(f).endswith(i) for i in INFRA):
                  continue
              for n, line in enumerate(f.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  if ALLOW.search(line):
                      continue
                  for pat, name in PATTERNS:
                      if pat.search(line):
                          print(f"::error file={f},line={n}::{name} bypasses useFormat()")
                          violations += 1
          for f in Path('.').rglob('*.tsx'):
              if any(p in f.parts for p in SKIP):
                  continue
              for n, line in enumerate(f.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  if ALLOW.search(line):
                      continue
                  for pat, name in PATTERNS:
                      if pat.search(line):
                          print(f"::error file={f},line={n}::{name} bypasses useFormat()")
                          violations += 1
          if violations:
              print(f"\n{violations} format violations", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Check i18n source-en purity
        run: |
          # `en` is the source locale — Lingui expects msgstr to be empty so
          # source text falls through. A populated en/messages.po breaks
          # fallback semantics.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          ENTRY_RE = re.compile(r'msgid\s+(?P<id>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)\nmsgstr\s+(?P<str>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)', re.M)
          def parse(s):
              return ''.join(re.findall(r'"((?:[^"\\]|\\.)*)"', s)).replace('\\n','\n').replace('\\"','"').replace('\\\\','\\')
          violations = 0
          for po in Path('.').rglob('locales/en/messages.po'):
              if 'node_modules' in po.parts:
                  continue
              text = po.read_text(encoding='utf-8', errors='replace')
              for m in ENTRY_RE.finditer(text):
                  src, tgt = parse(m.group('id')), parse(m.group('str'))
                  if src and tgt:
                      line = text.count('\n', 0, m.start()) + 1
                      print(f"::error file={po},line={line}::populated msgstr in en source: {tgt[:60]}")
                      violations += 1
          if violations:
              print(f"\n{violations} en-source violations (en/messages.po should have empty msgstrs)", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Check i18n plural-form completeness
        run: |
          # Each locale has required CLDR plural categories. If a translator
          # drops a required form (e.g. Welsh's `few`, Latvian's `zero`),
          # ICU throws at runtime. Catch it on PR.
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          REQUIRED = {
              # CLDR cardinal plural categories per locale (ICU runtime requirement)
              'ar': {'zero','one','two','few','many','other'},
              'cy': {'zero','one','two','few','many','other'},
              'ga': {'one','two','few','many','other'},
              'gd': {'one','two','few','other'},
              'mt': {'one','few','many','other'},
              'sl': {'one','two','few','other'},
              'lv': {'zero','one','other'},
              'lt': {'one','few','many','other'},
              'ru':'one,few,many,other'.split(','),
              'uk':'one,few,many,other'.split(','),
              'be':'one,few,many,other'.split(','),
              'pl':'one,few,many,other'.split(','),
              'cs':'one,few,many,other'.split(','),
              'sk':'one,few,many,other'.split(','),
              'sr':'one,few,other'.split(','),
              'hr':'one,few,other'.split(','),
              'bs':'one,few,other'.split(','),
              'ro':'one,few,other'.split(','),
              'he':'one,two,many,other'.split(','),
          }
          PLURAL_RE = re.compile(r'\{[^{}]*?,\s*plural\s*,\s*([^{}]+(?:\{[^{}]*\}[^{}]*)+)\}')
          ARM_RE = re.compile(r'\b(zero|one|two|few|many|other)\s*\{')
          ENTRY_RE = re.compile(r'msgid\s+(?P<id>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)\nmsgstr\s+(?P<str>"(?:[^"\\]|\\.)*"(?:\n"(?:[^"\\]|\\.)*")*)', re.M)
          def parse(s):
              return ''.join(re.findall(r'"((?:[^"\\]|\\.)*)"', s)).replace('\\n','\n').replace('\\"','"').replace('\\\\','\\')
          violations = 0
          for po in Path('.').rglob('locales/*/messages.po'):
              if 'node_modules' in po.parts:
                  continue
              locale = po.parent.name
              required = set(REQUIRED.get(locale, ()))
              if not required:
                  continue
              text = po.read_text(encoding='utf-8', errors='replace')
              for m in ENTRY_RE.finditer(text):
                  tgt = parse(m.group('str'))
                  if not tgt:
                      continue
                  for plural in PLURAL_RE.findall(tgt):
                      have = set(ARM_RE.findall(plural))
                      if have and not required.issubset(have):
                          missing = required - have
                          line = text.count('\n', 0, m.start()) + 1
                          print(f"::error file={po},line={line}::{locale} plural missing forms: {sorted(missing)}")
                          violations += 1
          if violations:
              print(f"\n{violations} plural-completeness violations", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Check Android i18n catalogues
        run: |
          # Single implementation, living with the resources it checks:
          # clients/android/tools/check-locales.py. Add checks there, not here.
          # Repos with no Android module skip rather than fail.
          checker=$(find . -path '*/tools/check-locales.py' -not -path './node_modules/*' | head -1)
          if [ -z "$checker" ]; then
            echo "No Android modules in this repo; nothing to check."
            exit 0
          fi
          root=$(dirname "$(dirname "$checker")")
          echo "Checking Android catalogues under $root"
          python3 "$checker" --discover "$root" --strict
