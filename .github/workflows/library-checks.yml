# CI for this package itself; the workflow beside this one is `workflow_call`
# only, invoked by the app repos for their own directories. Unlike those callers
# this needs no synthesised workspace root - the package declares everything it
# uses, so a plain install works from a bare checkout.

name: Library Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # For the audit job below: npm advisories need a clock rather than a push.
    # Off the hour, and off core's :17 and world's :37.
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Ordered cheapest-signal-first: types, then the suite, then style.
      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # Audits THIS library's graph, not the whole workspace: the canonical lockfile
  # is the umbrella's and the umbrella has no CI, so a full-graph scan runs only
  # locally, via `make audit` at the umbrella root.
  audit:
    # Scheduled and manual only. Advisories arrive on their own schedule, and a
    # new one appearing would otherwise fail an unrelated pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit dependencies
        # high and critical only, matching the Trivy gate on the Go side: pnpm
        # audit has no reachability analysis, so a lower threshold fires on
        # dev-only tooling no shipped bundle contains.
        run: pnpm audit --audit-level high
