# This library had no CI of its own. The workflow beside this one is
# `workflow_call` only: 22 app repos invoke it for THEIR directories, checking
# this package out merely as a sibling so the app can build. Nothing ever ran
# this package's lint, tests or typecheck - which is why two lint errors sat
# unnoticed until someone ran the command by hand.
#
# Unlike the app callers, this needs no synthesised workspace root: the package
# declares everything it uses, including the lingui eslint plugin and the react
# pair it tests against, so a plain install works from a bare checkout.

name: Library Checks

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    # Mondays 05:07 UTC, for the audit job below. npm advisories are published
    # without anyone touching this repository, so they need a clock rather than
    # a push. Off the hour, and off core's :17 and world's :37.
    - cron: '7 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # Ordered cheapest-signal-first: types, then the suite, then style.
      - name: Typecheck
        run: pnpm exec tsc -b

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

  # The JavaScript side had no dependency scanning of any kind while the Go side
  # ran govulncheck and Trivy on a schedule in both core and world. The esbuild
  # advisory that prompted this was found by someone running pnpm audit by hand,
  # which is not a gate.
  #
  # Scoped honestly: this audits THIS library's graph, not the whole workspace.
  # The canonical lockfile is the umbrella's, and the umbrella has no CI - it is
  # not on GitHub - so a full-graph scan can only run locally today, via
  # `make audit` at the umbrella root. Covering the shared library that every
  # app depends on is most of the value, and it is what CI can reach.
  audit:
    # Scheduled and manual only. Advisories arrive on their own schedule, and a
    # new one appearing would otherwise fail an unrelated pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit dependencies
        # high and critical only, matching the Trivy severity gate on the Go
        # side. pnpm audit has no reachability analysis, so a lower threshold
        # reports advisories in dev-only tooling that no shipped bundle
        # contains, and a gate nobody believes is worse than no gate.
        run: pnpm audit --audit-level high
